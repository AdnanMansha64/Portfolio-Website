name: Build & verify

# There is nothing to generate any more: docs/index.html is the single copy of
# the page, served both by this app (web root = docs) and by GitHub Pages
# (publishing folder = /docs). So CI just checks the project builds and that the
# published page still references assets that exist.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --nologo --warnaserror

      - name: Check every local asset the page references exists
        run: |
          python3 - <<'PY'
          import os, re, sys

          html = open('docs/index.html', encoding='utf-8').read()
          refs = sorted(set(re.findall(
              r'(?:href|src)="((?!https?:|mailto:|tel:|#|data:)[^"]+)"', html)))

          missing = [r for r in refs if not os.path.isfile(os.path.join('docs', r.split('?')[0]))]
          for r in refs:
              print(('ok   ' if r not in missing else 'MISS ') + r)
          if missing:
              print(f"::error::docs/index.html references missing files: {missing}")
              sys.exit(1)
          PY
