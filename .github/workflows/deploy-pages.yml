name: Deploy to GitHub Pages

# Renders Views/Home/Index.cshtml through the ASP.NET Core app and pushes the
# resulting static site to the gh-pages branch, which GitHub Pages serves via
# "Deploy from a branch".
#
# This keeps master single-source: the Razor view is the only copy of the page,
# and the generated HTML lives on its own branch instead of being committed
# alongside its own source.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Needed to push the generated site to the gh-pages branch.
permissions:
  contents: write

# Let a newer deploy supersede an in-flight one, but never cancel it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Render static site
        run: ./export-static.sh

      - name: Push to gh-pages
        working-directory: _site
        run: |
          set -euo pipefail
          # gh-pages holds generated output only, so each deploy is a single
          # fresh commit — there is no history worth preserving on it.
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA:0:7} from ${GITHUB_REF_NAME}"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
